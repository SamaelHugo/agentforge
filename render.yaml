# Render Blueprint — deploys the AgentForge backend on the free tier.
# Render dashboard → New → Blueprint → connect this repo → it reads this file.
# Auto-deploys on every push to the default branch.
services:
  - type: web
    name: agentforge-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Allow the Vercel frontend to call the API (tighten to your domain later).
      - key: CORS_ORIGINS
        value: "*"
      # Model the agents run on (Groq serves Llama on a free tier).
      - key: DEFAULT_MODEL
        value: llama-3.3-70b-versatile
      # Free, no credit card: https://console.groq.com → API Keys.
      # Render prompts for this at blueprint creation and keeps it secret.
      - key: GROQ_API_KEY
        sync: false
