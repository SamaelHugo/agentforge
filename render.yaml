# Render Blueprint — deploys the AgentForge backend on the free tier.
# Render dashboard → New → Blueprint → connect this repo → it reads this file.
# Auto-deploys on every push to the default branch.
services:
  - type: web
    name: agentforge-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Allow the Vercel frontend to call the API (tighten to your domain later).
      - key: CORS_ORIGINS
        value: "*"
      # Production Groq model with tool calling support.
      - key: DEFAULT_MODEL
        value: openai/gpt-oss-120b
      # Create a key at https://console.groq.com → API Keys.
      # Render prompts for this at blueprint creation and keeps it secret.
      - key: GROQ_API_KEY
        sync: false
      # Real external sources for the web_search tool.
      - key: TAVILY_API_KEY
        sync: false
      # Protect data-bearing API routes. Share this token only with demo users.
      - key: API_AUTH_TOKEN
        sync: false
      # DATABASE_URL is intentionally NOT declared here.
      #
      # Unset, the backend uses SQLite on the container's filesystem. Render's
      # free tier has no persistent disk and spins down after 15 min idle, so
      # that database is wiped on every restart: agents get re-seeded with new
      # ids and run history resets. Fine for a demo, not for keeping history.
      #
      # To persist, set DATABASE_URL in the dashboard (Environment tab) to an
      # external Postgres. Any provider works — the app normalises the URL and
      # ships psycopg. Neon (neon.tech) is the recommended free option: no
      # expiry, and it auto-wakes.
      #
      # Deliberately NOT a free Render Postgres: those expire 30 days after
      # creation and are deleted 14 days later, which would take the demo down
      # silently and permanently. See https://render.com/docs/free
