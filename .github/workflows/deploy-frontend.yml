name: Deploy frontend (Vercel)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Non-secret identifiers (from `vercel link`).
      VERCEL_ORG_ID: team_L936iovpZ4qFH1A7zNeLS2Gm
      VERCEL_PROJECT_ID: prj_qy5R1wgStHExK8PfvJtyyhJq9DE6
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"

      # NEXT_PUBLIC_API_URL is baked in at build time, and src/lib/api.ts falls
      # back to http://localhost:8000 when it is missing. That fallback ships a
      # dead site while every step still reports success, so fail loudly instead.
      # (It bit us once: the var was stored as "sensitive", whose value `vercel
      # pull` cannot read back, so CI silently built the fallback.)
      - name: Verify the API URL was baked in
        run: |
          set -euo pipefail
          envfile=.vercel/.env.production.local
          chunks=.vercel/output/static/_next/static/chunks

          # 1. `vercel pull` must actually have produced a URL. This is the step
          #    that failed for real: the var was stored as type "sensitive", and
          #    sensitive values cannot be read back by `pull`, so it arrived as "".
          url=$(grep -E '^NEXT_PUBLIC_API_URL=' "$envfile" 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
          if [ -z "$url" ]; then
            echo "::error::NEXT_PUBLIC_API_URL is empty after 'vercel pull' — the bundle would fall back to http://localhost:8000 and every visitor's browser would call their own machine."
            echo "Check: vercel env ls → it must exist for Production and NOT be type 'sensitive'."
            exit 1
          fi

          # 2. Assert the URL is present in the built output. Checking for the
          #    *absence* of the localhost fallback does not work: api.ts reads
          #    `process.env.NEXT_PUBLIC_API_URL?.replace(...) || "http://localhost:8000"`,
          #    and .replace() is only resolvable at runtime, so the minifier keeps
          #    the fallback string in every build — correct ones included.
          if [ ! -d "$chunks" ]; then
            echo "::error::$chunks not found — vercel build's output layout changed; this check can no longer prove anything."
            exit 1
          fi
          host=${url#*://}
          if ! grep -rq "$host" "$chunks"; then
            echo "::error::Built bundle does not contain $host — the API URL did not reach the compile step."
            exit 1
          fi
          echo "OK — bundle targets $url"

      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
